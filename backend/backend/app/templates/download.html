<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Virtual Try-On Result</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5C4A3D;
            --primary-dark: #47382d;
            --primary-light: #7a6352;
            --accent: #d4a373;
            --bg-start: #fbf7f4;
            --bg-end: #ede4dc;
            --text-main: #2b2520;
            --text-muted: #74685f;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(92, 74, 61, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(165deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justifyContent: center;
            padding: 1.5rem 1rem;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            background: rgba(212, 163, 115, 0.15);
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            margin-bottom: 0.5rem;
        }

        h1 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 0.25rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .image-card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(92, 74, 61, 0.08);
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .image-wrapper {
            width: 100%;
            max-height: 65vh;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justifyContent: center;
            background: #f0eae4;
        }

        img {
            width: 100%;
            height: auto;
            max-height: 65vh;
            object-fit: contain;
            display: block;
            border-radius: 14px;
        }

        .actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        .download-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--primary);
            color: #ffffff;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            padding: 0.95rem 1.5rem;
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(92, 74, 61, 0.28);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(92, 74, 61, 0.35);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .tip-box {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            padding: 0 0.5rem;
        }

        .tip-box strong {
            color: var(--primary);
        }

        footer {
            margin-top: 1.75rem;
            font-size: 0.75rem;
            color: #9c8e84;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">Virtual Trial Room</span>
            <h1>Your Virtual Try-On</h1>
            <p class="subtitle">Here is your customized look!</p>
        </div>

        <div class="image-card">
            <div class="image-wrapper">
                <img id="tryonImage" src="/api/image/${image_id}" alt="Virtual Try-On Result" loading="eager">
            </div>
        </div>

        <div class="actions">
            <a id="downloadBtn" href="/api/image/${image_id}?download=true" download="virtual-tryon.jpg" class="download-btn">
                <span>⬇ Download Look</span>
            </a>
            <p class="tip-box">
                📱 <strong>Tip:</strong> You can also touch and hold the photo to save it directly to your Photos / Gallery.
            </p>
        </div>

        <footer>
            Virtual Trial Room &bull; AI Powered Fitting
        </footer>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const imageId = '${image_id}';
        const downloadUrl = '/api/image/' + imageId + '?download=true';

        downloadBtn.addEventListener('click', async function(e) {
            // Provide instant tactile visual feedback
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<span>⏳ Downloading...</span>';

            try {
                // Fetch blob and trigger download for modern mobile/desktop browsers
                const response = await fetch(downloadUrl);
                if (!response.ok) throw new Error('Download failed');
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const tempLink = document.createElement('a');
                tempLink.href = blobUrl;
                tempLink.download = 'virtual-tryon-' + imageId.substring(0, 8) + '.jpg';
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);
                setTimeout(() => window.URL.revokeObjectURL(blobUrl), 2000);

                downloadBtn.innerHTML = '<span>✅ Saved! Download Again</span>';
                setTimeout(() => {
                    downloadBtn.innerHTML = originalText;
                }, 3500);
            } catch (err) {
                // Fallback to direct navigation download if blob fails
                downloadBtn.innerHTML = originalText;
                window.location.href = downloadUrl;
            }
        });
    </script>
</body>
</html>
